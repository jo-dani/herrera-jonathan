<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piedra, Papel o Tijeras - Sabores del Mundo</title>

    <link rel="stylesheet" href="piedra-papel-tijeras.css">
</head>

<body>

    <h1>🪨 Piedra, Papel o Tijeras ✂️</h1>

    <div class="juego">

        <h2>Elegí una opción</h2>

        <div class="opciones">

            <button class="opcion" data-opcion="piedra">
                🪨 Piedra
            </button>

            <button class="opcion" data-opcion="papel">
                📄 Papel
            </button>

            <button class="opcion" data-opcion="tijera">
                ✂️ Tijera
            </button>

        </div>

        <p id="eleccionUsuario"></p>

        <p id="eleccionComputadora"></p>

        <h2 id="resultado"></h2>

        <p id="marcador">
            Usuario: 0 | Computadora: 0
        </p>

        <button id="reiniciar">
            Reiniciar juego
        </button>

    </div>

    <a href="index.html" class="volver">
        Volver a Sabores del Mundo
    </a>

    <script src="piedra-papel-tijeras.js"></script>

</body>

</html>
